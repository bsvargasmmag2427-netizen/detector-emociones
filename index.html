<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Reconocedor de Rostros</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #f0f2f5; padding: 20px; }
        h1 { color: #333; }
        #webcam-container { margin: 20px auto; border: 4px solid #333; width: 200px; height: 200px; border-radius: 10px; overflow: hidden; }
        #label-container { font-size: 24px; font-weight: bold; margin-top: 20px; color: #007bff; }
        button { padding: 10px 20px; font-size: 16px; background: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background: #218838; }
    </style>
</head>
<body>

    <h1>Reconocedor de Rostros IA</h1>
    <button type="button" onclick="init()">Iniciar Cámara</button>
    
    <div id="webcam-container"></div>
    <div id="label-container">Presiona iniciar...</div>

    <!-- Cargar TensorFlow.js y Teachable Machine -->
    <script src="https://jsdelivr.net"></script>
    <script src="https://jsdelivr.net"></script>

    <script type="text/javascript">
        // PEGA AQUÍ TU ENLACE DE TEACHABLE MACHINE (Asegúrate de que termine en /)
        const URL = "https://teachablemachine.withgoogle.com/models/z_8jaSIz3/";

        let model, webcam, labelContainer, maxPredictions;

        async function init() {
            const modelURL = URL + "model.json";
            const metadataURL = URL + "metadata.json";

            document.getElementById("label-container").innerHTML = "Cargando modelo...";
            
            // Cargar el modelo de IA
            model = await tmImage.load(modelURL, metadataURL);
            maxPredictions = model.getTotalClasses();

            // Configurar la webcam
            const flip = true; 
            webcam = new tmImage.Webcam(200, 200, flip); 
            await webcam.setup(); 
            await webcam.play();
            window.requestAnimationFrame(loop);

            // Agregar la webcam a la página web
            document.getElementById("webcam-container").appendChild(webcam.canvas);
            labelContainer = document.getElementById("label-container");
        }

        async function loop() {
            webcam.update(); // Actualizar el frame de la cámara
            await predict();
            window.requestAnimationFrame(loop);
        }

        async function predict() {
            // Analizar la imagen actual de la cámara
            const prediction = await model.predict(webcam.canvas);
            
            let mejorPrediccion = "";
            let maximaProbabilidad = 0;

            // Buscar cuál clase tiene el porcentaje más alto
            for (let i = 0; i < maxPredictions; i++) {
                if (prediction[i].probability > maximaProbabilidad) {
                    maximaProbabilidad = prediction[i].probability;
                    mejorPrediccion = prediction[i].className;
                }
            }

            // Mostrar el nombre en pantalla si pasa del 70% de seguridad
            if (maximaProbabilidad > 0.70) {
                labelContainer.innerHTML = `Detectado: ${mejorPrediccion} (${(maximaProbabilidad * 100).toFixed(0)}%)`;
            } else {
                labelContainer.innerHTML = "Buscando rostro...";
            }
        }
    </script>
</body>
</html>
